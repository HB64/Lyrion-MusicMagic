name: Sync upstream MusicMagic plugin (public/9.2)

# Watches Slim/Plugin/MusicMagic in LMS-Community/slimserver on the public/9.2
# branch and opens a pull request in this repo whenever those files change
# upstream. It never touches the actual 9.1 plugin code above - it only
# updates the dev/ mirror folder, so you can review exactly what changed and
# decide yourself what to port into the real plugin files.

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust as needed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5

      - name: Sparse-checkout the MusicMagic folder from upstream
        run: |
          git clone --filter=blob:none --no-checkout --branch public/9.2 --depth 1 \
            https://github.com/LMS-Community/slimserver.git upstream-checkout
          cd upstream-checkout
          git sparse-checkout init --cone
          git sparse-checkout set Slim/Plugin/MusicMagic
          git checkout public/9.2
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mirror into dev/ reference folder
        run: |
          rm -rf dev
          mkdir -p dev
          cp -r upstream-checkout/Slim/Plugin/MusicMagic dev/
          rm -rf upstream-checkout

      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain dev | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the updated mirror
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync-upstream-9.2
          git add dev
          git commit -m "Sync upstream MusicMagic (public/9.2 @ ${{ env.UPSTREAM_COMMIT }})"
          git push --force origin sync-upstream-9.2

      - name: Open or update the pull request via gh CLI
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated sync: \`Slim/Plugin/MusicMagic\` changed upstream in [LMS-Community/slimserver](https://github.com/LMS-Community/slimserver/tree/public/9.2/Slim/Plugin/MusicMagic) (commit \`${{ env.UPSTREAM_COMMIT }}\`).

          This PR only updates the \`dev/\` reference mirror - it does **not** touch the actual 9.1 plugin code in \`Slim/Plugin/MusicMagic/\` above. Review the diff here to see what changed upstream, then manually port whatever is relevant into the real plugin files."

          if gh pr view sync-upstream-9.2 >/dev/null 2>&1; then
            gh pr edit sync-upstream-9.2 \
              --title "Upstream MusicMagic changes (public/9.2 @ ${{ env.UPSTREAM_COMMIT }})" \
              --body "$BODY"
          else
            gh pr create \
              --title "Upstream MusicMagic changes (public/9.2 @ ${{ env.UPSTREAM_COMMIT }})" \
              --body "$BODY" \
              --base main \
              --head sync-upstream-9.2
          fi
